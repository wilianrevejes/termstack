# tmux — shared base across the machines.
# Lives at ~/.config/tmux/tmux.conf (link to this repository's tmux/).
# Requires tmux 3.1+ (`{}` blocks in if-shell).

# ── Prefix ────────────────────────────────────────────────────────────────
# Ctrl+Space. Doesn't collide with WezTerm's leader (Ctrl+a) or with
# anything in Vim.
unbind C-b
set -g prefix C-Space
# A doubled prefix sends Ctrl+Space onward — needed for nested tmux or ssh.
bind C-Space send-prefix

# ── Terminal ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# True color inside tmux. Without this, catppuccin and the Neovim theme come
# out with approximate colors instead of the exact ones.
set -ag terminal-overrides ",*256col*:RGB,xterm-256color:RGB"
# Neovim's :autoread and focus detection.
set -g focus-events on
# Responsive ESC in Neovim. The 500ms default feels like a freeze.
set -sg escape-time 10

set -g mouse on
set -g history-limit 50000
set -g set-clipboard on
# resurrect kills the session at index 0; without this the whole terminal
# closes.
set -g detach-on-destroy off

# Windows and panes start at 1: aligns with the key positions on the keyboard.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Panes and windows ─────────────────────────────────────────────────────
# Same mnemonic as WezTerm: | side by side, - stacked. They inherit the
# directory.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -r allows repeating without pressing the prefix again.
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Vi-style copy mode ────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ── Plugins ───────────────────────────────────────────────────────────────
# Installed by scripts/bootstrap-*.sh. Inside tmux: prefix + I installs,
# prefix + U updates.
#
# Pins the path: without this TPM uses ~/.tmux/plugins and the `run` calls
# below, which point at ~/.config/tmux/plugins, find nothing.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

# Everything pinned to a tag (same reason as Neovim's lazy-lock.json): these
# plugins run shell inside tmux, and a moving HEAD would deliver compromised
# upstream to the five machines on the next update, unreviewed. The
# scripts/_common.sh only switches version when the #tag here changes.
#
# tmux-cpu is the only one with NO published tag at all — it floats on HEAD
# for lack of an option. Pinning to a branch doesn't work: the pin detector
# uses `git tag --points-at`, and a branch would re-clone on every round.
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-sensible#v3.0.0'
set -g @plugin 'tmux-plugins/tmux-yank#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery#v2.0.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'
# catppuccin broke compatibility between v1 and v2 — the pin here came before
# the others.
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Conscious decision: this writes the visible pane text as plain text into
# ~/.local/share/tmux/resurrect/ (continuum saves every 15 min) — including
# any secret a command prints on screen. It stays out of git, but it stays on
# disk. The full visual restore is worth the cost here; for layout,
# directories and processes only, switch to 'off'.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'ssh vim nvim'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# The if-shell avoids a config error on a fresh clone: with no plugins, tmux
# comes up without a theme instead of breaking.
if-shell '[ -d "$HOME/.config/tmux/plugins/tpm" ]' {
  # TPM loads every plugin, catppuccin included.
  run "$HOME/.config/tmux/plugins/tpm/tpm"

  # The bar is assembled AFTER tpm: the @catppuccin_status_* modules only
  # come into existence once catppuccin has loaded.
  set -g status-left-length 100
  set -g status-right-length 100
  set -g status-left "#{E:@catppuccin_status_session}"

  # The icons require a Nerd Font — the same one the bootstrap installs.
  set -g  status-right ""
  set -ag  status-right "#{E:@catppuccin_status_application}"
  set -agF status-right "#{E:@catppuccin_status_cpu}"
  set -agF status-right "#{E:@catppuccin_status_ram}"
  set -agF status-right "#{E:@catppuccin_status_battery}"
  set -ag  status-right "#{E:@catppuccin_status_date_time}"

  # cpu/ram and battery are catppuccin widgets, but the numbers come from
  # these two plugins: they replace their own placeholders in the bar at the
  # moment they run, so they have to run after the bar is assembled.
  run "$HOME/.config/tmux/plugins/tmux-cpu/cpu.tmux"
  run "$HOME/.config/tmux/plugins/tmux-battery/battery.tmux"
}
